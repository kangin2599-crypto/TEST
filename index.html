<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .balance-info { font-size: 18px; font-weight: bold; }
        .btn-group { display: flex; gap: 8px; }
        button { background: #2c2c2c; color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #3c3c3c; }
        button.active { background: #ffffff; color: #000000; font-weight: bold; }
        .modal { display: none; background: #252525; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .modal.show { display: block; }
        .coupon-list { background: #181818; border: 1px solid #333; border-radius: 6px; padding: 10px; min-height: 40px; margin-bottom: 10px; color: #aaa; font-size: 14px; }
        .coupon-item { display: flex; justify-content: space-between; padding: 4px 0; color: #fff; border-bottom: 1px solid #2a2a2a; }
        .coupon-item:last-child { border-bottom: none; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"], input[type="number"] { background: #ffffff; color: #000; border: 1px solid #ccc; padding: 8px 12px; border-radius: 4px; flex: 1; outline: none; }
        .game-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .game-tabs button { padding: 12px 0; text-align: center; }
        .guide-text { font-size: 12px; color: #aaa; margin-bottom: 10px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">test</div>
    
    <div class="header">
        <div class="balance-info">잔액: <span id="balance">150</span> L</div>
        <div class="btn-group">
            <button onclick="toggleModal('userCouponModal')">쿠폰 입력</button>
            <button class="active" onclick="toggleModal('adminModal')">관리자</button>
        </div>
    </div>

    <!-- 유저 쿠폰 입력 모달 -->
    <div id="userCouponModal" class="modal">
        <div class="input-group">
            <input type="text" id="userCouponInput" placeholder="쿠폰 코드를 입력하세요">
            <button onclick="useCoupon()">사용</button>
        </div>
    </div>

    <!-- 관리자 모달 -->
    <div id="adminModal" class="modal show">
        <div style="font-weight: bold; margin-bottom: 10px;">전체 기기 공용 쿠폰 목록</div>
        <div id="adminCouponList" class="coupon-list">
            공용 등록된 쿠폰 없음
        </div>
        
        <p class="guide-text">* 아래 버튼을 누르면 모든 기기에서 공유되는 쿠폰을 작성하는 GitHub 페이지가 열립니다. 생성한 텍스트를 붙여넣고 Comment만 누르면 적용됩니다.</p>
        
        <div class="input-group">
            <input type="text" id="newCode" placeholder="쿠폰 코드">
            <input type="number" id="newAmount" placeholder="금액(L)">
            <button onclick="generateGitHubCouponText()">전체 공용 쿠폰 발행</button>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 15px;">
            <button onclick="changeBalance()">내 잔액 수정</button>
            <button onclick="toggleModal('adminModal')">닫기</button>
        </div>
    </div>

    <!-- 게임 탭 -->
    <div class="game-tabs">
        <button class="active">주사위</button>
        <button>블랙잭</button>
        <button>세븐포커</button>
        <button>홀덤</button>
    </div>
</div>

<script>
    // GitHub 설정 정보
    const GITHUB_CONFIG = {
        owner: "kangin2599-crypto",
        repo: "TEST",
        issueNumber: 1
    };

    let userBalance = 150;
    let coupons = [];

    // 모달 토글
    function toggleModal(id) {
        const target = document.getElementById(id);
        const isShowing = target.classList.contains('show');
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        if (!isShowing) {
            target.classList.add('show');
            if (id === 'adminModal') {
                fetchGitHubCoupons();
            }
        }
    }

    // GitHub API에서 쿠폰 데이터 로드
    async function fetchGitHubCoupons() {
        coupons = [];
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/issues/${GITHUB_CONFIG.issueNumber}/comments?timestamp=${Date.now()}`;
        
        try {
            const response = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });

            if (response.ok) {
                const comments = await response.json();
                comments.forEach(c => {
                    try {
                        const bodyText = c.body.trim();
                        const parsed = JSON.parse(bodyText);
                        if (parsed.code && parsed.amount) {
                            const upperCode = String(parsed.code).trim().toUpperCase();
                            if (!coupons.some(item => item.code === upperCode)) {
                                coupons.push({ code: upperCode, amount: parseInt(parsed.amount) });
                            }
                        }
                    } catch(e) {
                        // JSON 형식이 아닌 일반 댓글은 무시
                    }
                });
            } else {
                console.error("GitHub API 불러오기 실패 (상태 코드):", response.status);
                if (response.status === 404) {
                    alert("GitHub 저장소가 Private(비공개)이거나 설정 정보(owner, repo, issueNumber)가 틀렸습니다.");
                }
            }
        } catch (err) {
            console.error("GitHub API 네트워크 오류:", err);
        }
        renderAdminCoupons();
    }

    // 쿠폰 목록 화면 렌더링
    function renderAdminCoupons() {
        const container = document.getElementById('adminCouponList');
        if (coupons.length === 0) {
            container.innerHTML = '공용 등록된 쿠폰 없음';
            return;
        }
        
        container.innerHTML = coupons.map(c => 
            `<div class="coupon-item">
                <span>코드: <strong>${c.code}</strong></span>
                <span>${c.amount} L</span>
            </div>`
        ).join('');
    }

    // 쿠폰 생성용 GitHub 이슈 댓글 작성 페이지 이동
    function generateGitHubCouponText() {
        const code = document.getElementById('newCode').value.trim();
        const amount = document.getElementById('newAmount').value.trim();

        if (!code || !amount) {
            alert('쿠폰 코드와 금액을 모두 입력하세요.');
            return;
        }

        const jsonText = JSON.stringify({ code: code, amount: parseInt(amount) });
        const githubUrl = `https://github.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/issues/${GITHUB_CONFIG.issueNumber}`;
        
        navigator.clipboard.writeText(jsonText).then(() => {
            alert(`쿠폰 데이터가 복사되었습니다!\n열리는 GitHub 페이지의 댓글란에 붙여넣기(Ctrl+V) 후 Comment를 누르세요.\n\n복사된 내용: ${jsonText}`);
            window.open(githubUrl, '_blank');
        }).catch(() => {
            prompt("아래 텍스트를 복사하여 GitHub 이슈 댓글로 작성하세요:", jsonText);
            window.open(githubUrl, '_blank');
        });
    }

    // 쿠폰 사용
    function useCoupon() {
        const inputCode = document.getElementById('userCouponInput').value.trim().toUpperCase();
        const found = coupons.find(c => c.code === inputCode);

        if (found) {
            userBalance += found.amount;
            document.getElementById('balance').innerText = userBalance;
            alert(`${found.amount} L가 지급되었습니다!`);
            document.getElementById('userCouponInput').value = '';
            toggleModal('userCouponModal');
        } else {
            alert('유효하지 않은 쿠폰 코드입니다.');
        }
    }

    // 내 잔액 수정
    function changeBalance() {
        const newBal = prompt("수정할 잔액을 입력하세요:", userBalance);
        if (newBal !== null && !isNaN(newBal)) {
            userBalance = parseInt(newBal);
            document.getElementById('balance').innerText = userBalance;
        }
    }

    // 페이지 로드시 쿠폰 로드
    window.onload = function() {
        fetchGitHubCoupons();
    };
</script>

</body>
</html>
