<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강인 코인 / 토큰 관리 및 교환기</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00ff88;
            --accent-hover: #00cc6a;
            --text-main: #ffffff;
            --text-sub: #8a99ad;
            --border-color: #262e3d;
            --danger-color: #ff4d4d;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            color: var(--accent-color);
        }

        .tab-menu {
            display: flex;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: var(--text-sub);
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .admin-login-box {
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>강인 암호화폐 센터</h1>
    </div>

    <!-- 탭 메뉴 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('user-tab')">사용자 메인</button>
        <button class="tab-btn" onclick="switchTab('admin-tab')">관리자</button>
    </div>

    <!-- 사용자 탭 -->
    <div id="user-tab" class="tab-content active">
        <div class="form-group">
            <label>지갑 주소</label>
            <input type="text" placeholder="0x..." readonly value="0x71C...39A2">
        </div>
        <div class="form-group">
            <label>교환할 강인 코인 수량</label>
            <input type="number" id="coin-amount" placeholder="0.0">
        </div>
        <button class="btn" onclick="alert('교환 요청이 완료되었습니다.')">코인 교환하기</button>
    </div>

    <!-- 관리자 탭 -->
    <div id="admin-tab" class="tab-content">
        <!-- 로그인 구역 -->
        <div id="admin-auth-sec" class="admin-login-box">
            <div class="form-group">
                <label for="admin-pass-input">관리자 암호</label>
                <input type="password" id="admin-pass-input" placeholder="비밀번호를 입력하세요">
            </div>
            <button class="btn" onclick="verifyAdminPassword()">관리자 로그인</button>
        </div>

        <!-- 인증 완료 후 표시될 관리자 패널 -->
        <div id="admin-panel" style="display: none;">
            <h3>관리자 대시보드</h3>
            <p style="color: var(--accent-color);">인증에 성공하였습니다.</p>
            
            <div class="form-group">
                <label>시스템 상태 설정</label>
                <input type="text" value="정상 가동 중">
            </div>
            <button class="btn" style="background: var(--danger-color); color: #fff;" onclick="logoutAdmin()">로그아웃</button>
        </div>
    </div>
</div>

<script>
    // 탭 전환 기능
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // SHA-256 해시 함수 (Web Crypto API 사용)
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 'kangin2599!'의 SHA-256 해시값
    const ADMIN_PASSWORD_HASH = "5e0eb0092c6e6e22f30b91ec8fbcd58cb4cf39e144a04e54cd0efedbe73f640f";

    // 비밀번호 검증 함수
    async function verifyAdminPassword() {
        const inputPass = document.getElementById('admin-pass-input').value;
        
        if (!inputPass) {
            alert("비밀번호를 입력해주세요.");
            return;
        }

        // 입력받은 단어를 SHA-256으로 해싱 후 비교
        const inputHash = await hashPassword(inputPass);

        if (inputHash === ADMIN_PASSWORD_HASH) {
            alert("관리자로 인증되었습니다.");
            document.getElementById('admin-auth-sec').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('admin-pass-input').value = '';
        } else {
            alert("비밀번호가 올바르지 않습니다.");
        }
    }

    // 로그아웃 처리
    function logoutAdmin() {
        document.getElementById('admin-auth-sec').style.display = 'block';
        document.getElementById('admin-panel').style.display = 'none';
    }
</script>

</body>
</html>
